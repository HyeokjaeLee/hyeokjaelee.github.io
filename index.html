ot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;piLoop 감사에서 분석 에이전트가 6개 버그를 찾았는데 진짜는 1개였다. 컨텍스트 모드 권한 설계에서도 내 판단이 사용자 정정으로 뒤집혔다.&quot;],&quot;date&quot;:[0,&quot;2026-06-21T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 21일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/one-line-three-rules-oneshot-consumed-before-trigger/&quot;],&quot;title&quot;:[0,&quot;한 줄에 세 규칙을 넣으면 안 되는 이유와 원샷 소비 함정&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;set_line으로 규칙을 고치다가 다른 규칙이 조용히 사라졌다. 세션 타이틀이 첫 요청에서 안 붙는 버그도 찾았다. 원인은 원샷이 트리거 전에 소비되는 거였다.&quot;],&quot;date&quot;:[0,&quot;2026-06-19T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 19일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/agent-self-improvement-bash-timeout-crash-saga/&quot;],&quot;title&quot;:[0,&quot;에이전트가 스스로를 개선하는 날, 4회 크래시 끝에 수료증 QA 통과&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;pi 확장 7종을 새로 짜고 스킬 20개를 포팅했다. 그러는 사이 수료증 기능은 모델 장애로 4번 크래시 났다가 마지막에 통과했다. 그리고 토스증권 CLI도 새로 만들었다.&quot;],&quot;date&quot;:[0,&quot;2026-06-18T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 18일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/chrome-grid-failure-false-pass-flexbox/&quot;],&quot;title&quot;:[0,&quot;Chrome grid 결함과 flexbox로 돌아선 날, 거짓 PASS의 함정&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;footer가 화면 바닥에 안 붙었다. grid minmax가 대화면에서만 실패했다. 소화면에서 PASS라고 믿었다가 거짓 PASS였다. flexbox로 전환해서 해결했다.&quot;],&quot;date&quot;:[0,&quot;2026-06-17T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 17일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/setup-once-reactivity-trap-latent-risk-ignition/&quot;],&quot;title&quot;:[0,&quot;설정 한 번으로 영원히 막히는 반응성 버그와 잠재 위험 점화&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;Vue의 setup 한 번 값이 watchEffect를 영구적으로 막아서 간헐적 버그를 만들었다. 그리고 두 달 전의 변경이 이미지 리빌드로 점화된 MCP 멈춤도 잡았다.&quot;],&quot;date&quot;:[0,&quot;2026-06-16T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 16일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/tool-call-as-text-hypothesis-refutation/&quot;],&quot;title&quot;:[0,&quot;에이전트가 도구를 호출하지 않고 텍스트로 뱉는 현상의 원인 추적&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;AI 에이전트가 도구 호출을 텍스트로 출력하기만 하고 실행하지 않았다. prefill 에러를 원인으로 지목했다가, 같은 현상이 다른 모델에서도 재현되면서 가설이 깨졌다.&quot;],&quot;date&quot;:[0,&quot;2026-06-15T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 15일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/three-lessons-one-commit-qa-summary-provider-speed/&quot;],&quot;title&quot;:[0,&quot;3일간의 교훈이 한 커밋에 담긴 날&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;QA 에이전트가 요약된 값을 받아서 잘못 통과시킨 일로 검증 규칙을 네 번 다듬었다. 같은 모델인데 프로바이더에 따라 60배 느린 것도 확인했다. 며칠의 교훈이 한 커밋에 담겼다.&quot;],&quot;date&quot;:[0,&quot;2026-06-14T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 14일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/zed-tui-rendering-glm52-release-day/&quot;],&quot;title&quot;:[0,&quot;Zed 터미널 렌더링 깨짐과 GLM-5.2 출시일 동시 대응&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;Zed에서 TUI가 깨지는 원인이 동기화 출력 미지원이었다. 같은 날 GLM-5.2가 나와서 커스텀 프로바이더를 등록하고 컨텍스트 한계를 직접 검증했다.&quot;],&quot;date&quot;:[0,&quot;2026-06-13T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 13일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/forced-migration-constraints-to-patterns/&quot;],&quot;title&quot;:[0,&quot;강제 마이그레이션과 제약에서 패턴을 만드는 날&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;Claude 계정이 갑자기 revoke돼서 사내 AI 게이트웨이로 마이그레이션했다. 그 제약이 이중 설정 패턴이 됐다. 그리고 수료증 PDF 다운로드와 화상감독 메시지 수정도 끝냈다.&quot;],&quot;date&quot;:[0,&quot;2026-06-12T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 12일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/prompt-injection-cascade-bugs-ghost-crawler-redesign/&quot;],&quot;title&quot;:[0,&quot;프롬프트 주입 시스템 연쇄 버그와 괴담 크롤러 파이프라인 재설계&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;프롬프트 주입 시스템에서 5개의 연쇄 버그를 잡았다. 필터 교차 제외, 전역 상태 오염, Go 코어 단일 파트 제한까지. 그리고 괴담 크롤러 파이프라인을 재설계했다.&quot;],&quot;date&quot;:[0,&quot;2026-06-11T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 11일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/nonexistent-bug-token-budget-overengineering/&quot;],&quot;title&quot;:[0,&quot;존재하지 않는 버그를 고치려다 과도하게 만든 토큰 예산 시스템&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;프롬프트가 매번 주입된다고 생각해서 토큰 예산 시스템을 복잡하게 만들었다. 근데 실제로는 한 번 주입되고 컨텍스트에 남아있는 것뿐이었다. 간단한 해결로 되돌렸다.&quot;],&quot;date&quot;:[0,&quot;2026-06-10T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 10일&quot;]}],[0,{&quot;slug&quot;:[0,&quot;/multi-agent-team-prompt-junk-data-30-percent/&quot;],&quot;title&quot;:[0,&quot;멀티 에이전트 팀 프롬프트 설계와 쓰레기 데이터 30% 문제&quot;],&quot;titleImage&quot;:[0,&quot;/_astro/dev-diary.ezQbq5hF.png&quot;],&quot;tags&quot;:[1,[[0,&quot;journal&quot;]]],&quot;description&quot;:[0,&quot;PM, 프론트엔드, 백엔드, QA 에이전트가 협력하는 팀을 만들었다. 픽셀 퍼펙트와 토큰 우선의 충돌을 해결했다. 그리고 괴담 수집에서 30%가 쓰레기 데이터인 문제도 진단했다.&quot;],&quot;date&quot;:[0,&quot;2026-06-09T00:00:00.000Z&quot;],&quot;dateLabel&quot;:[0,&quot;26년 06월 0
